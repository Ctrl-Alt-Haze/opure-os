[package]
name = "opure-hypervisor"
version = "0.1.0"
edition = "2021"
authors = ["OPURE Core Architecture Team"]
license = "Apache-2.0 OR MIT"
description = "Type-1 Bare-Metal Micro-Virtualization Hypervisor for OPURE OS"

[dependencies]
opure-hal = { path = "../opure-hal" }
opure-bus = { path = "../opure-bus" }
opure-oztae = { path = "../opure-oztae" }
opure-lifter = { path = "../opure-lifter" }
opure-boot = { path = "../opure-boot" }

[lib]
crate-type = ["rlib"]

[features]
default = []
